name: RAI-112 dependency lock bootstrap

on:
  push:
    branches:
      - feat/rai112-supply-chain-hardening
    paths:
      - '.github/workflows/bootstrap-dependency-locks.yml'

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/rai112-supply-chain-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Generate Python production and CI locks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip==24.3.1 pip-tools==7.5.0 pip-audit==2.10.1
          python -m piptools compile apps/api/pyproject.toml             --output-file apps/api/requirements.lock             --generate-hashes             --strip-extras
          python -m piptools compile apps/api/pyproject.toml             --extra dev             --output-file apps/api/requirements-dev.lock             --generate-hashes             --strip-extras

      - name: Generate web package lock
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/requirements.lock apps/api/requirements-dev.lock apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
          else
            git commit -m "chore: generate deterministic dependency locks"
            git push origin HEAD:feat/rai112-supply-chain-hardening
          fi

      - name: Fresh-install and audit Python production lock
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/rai112-prod
          /tmp/rai112-prod/bin/python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
          /tmp/rai112-prod/bin/python -m pip install --disable-pip-version-check pip-audit==2.10.1
          /tmp/rai112-prod/bin/pip-audit --skip-editable

      - name: Fresh-install Python CI lock
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/rai112-dev
          /tmp/rai112-dev/bin/python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements-dev.lock

      - name: Fresh-install and audit web lock
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit
          npm audit --audit-level=high

      - name: Resolve current official OCI index identities
        shell: bash
        run: |
          set -euo pipefail
          for image in             "python:3.11-slim"             "node:22.23.2-alpine3.24"             "redis:7-alpine"
          do
            echo "IMAGE=$image"
            docker buildx imagetools inspect "$image" | sed -n '1,5p'
          done
