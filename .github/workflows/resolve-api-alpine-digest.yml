name: Resolve Executive API Alpine digest

on:
  push:
    branches:
      - feat/rai112-supply-chain-hardening
    paths:
      - '.github/workflows/resolve-api-alpine-digest.yml'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve official multi-platform Python Alpine index
        shell: bash
        run: |
          set -euo pipefail
          image="python:3.11-alpine3.24"
          echo "IMAGE=$image"
          docker buildx imagetools inspect "$image" | sed -n '1,5p'
