name: Refresh Executive web lock

on:
  push:
    branches:
      - feat/rai112-supply-chain-hardening
    paths:
      - '.github/workflows/refresh-web-lock.yml'
      - 'apps/web/package.json'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/rai112-supply-chain-hardening
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Regenerate lock and verify web stack
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
      - name: Commit regenerated lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lock already current"
          else
            git commit -m "chore: refresh audited Executive web lock"
            git push origin HEAD:feat/rai112-supply-chain-hardening
          fi
