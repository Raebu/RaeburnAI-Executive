name: One-time secure web dependency upgrade (P0)
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  upgrade-and-verify:
    if: github.event.pull_request.head.ref == 'fix/p0-web-dependency-audit-20261015' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22.23.2'
      - name: Fix vulnerable web packages without force or audit suppression
        working-directory: apps/web
        run: |
          npm install --save-exact --ignore-scripts --no-audit --no-fund next@16.4.1
          npm install --save-dev --save-exact --ignore-scripts --no-audit --no-fund eslint-config-next@16.4.1
          npm audit fix --ignore-scripts --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run build
      - name: Record tested lockfile-only changes and remove one-time workflow
        run: |
          git rm .github/workflows/p0-one-time-dependency-upgrade.yml
          git add apps/web/package.json apps/web/package-lock.json
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(web): update vulnerable Next.js and audited dependencies'
          git push origin HEAD:fix/p0-web-dependency-audit-20261015
